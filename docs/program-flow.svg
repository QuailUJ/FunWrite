<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1640' viewBox='0 0 1600 1640'><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 Z' fill='#517b9a'/></marker></defs><rect width='1600' height='1640' fill='#f8fbfd'/><text x='42' y='54.4' font-size='37.324' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>FunWrite 2.0 程式流程</text><text x='40' y='101.4' font-size='23.994' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>主程式與操作</text><text x='880' y='101.4' font-size='23.994' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>WritingScorer 評分內部</text><rect x='40' y='125' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='154.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>Program / TemplateLibrary</text><text x='56' y='179.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>Main() → TemplateLibrary.PracticeWords(), Load(), ReadImported()</text><text x='56' y='204.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>讀取字單、範例中心線與部件資料</text><rect x='40' y='260' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='289.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>PracticeForm</text><text x='56' y='314.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>PracticeForm.OnPaint() / DrawPractice() / DrawGrid()</text><text x='56' y='339.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>完整不透明畫面一次繪製／雙緩衝</text><rect x='40' y='395' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='424.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>TabletDevice</text><text x='56' y='449.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>TabletDevice.ConnectAsync() / Receive() / Normalize()</text><text x='56' y='474.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>背景連接寫字板；座標與壓力正規化</text><rect x='40' y='530' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='559.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>PracticeSession</text><text x='56' y='584.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>PracticeForm.Feed() → PracticeSession.Accept() / Select()</text><text x='56' y='609.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>選字格、保存原始落筆與提筆事件</text><rect x='40' y='665' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='694.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>要求評分</text><text x='56' y='719.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>PracticeForm.Score() / PracticeSession.ScorePending()</text><text x='56' y='744.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>螢幕按鈕、Enter 或實體評分區</text><rect x='40' y='800' width='600' height='95' rx='6' fill='#dff3ed' stroke='#517b9a' stroke-width='2'/><text x='56' y='829.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>WritingScorer</text><text x='56' y='854.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>WritingScorer.Evaluate()</text><text x='56' y='879.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>使用右欄同一套評分流程</text><rect x='40' y='935' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='964.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>RecordStore</text><text x='56' y='989.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>RecordStore.Save()</text><text x='56' y='1014.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>先保存原始筆跡，保留可重算的資料</text><rect x='40' y='1070' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='1099.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>判斷是否通過</text><text x='56' y='1124.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>WritingEvaluation.Passed / PracticeSession.ScorePending()</text><text x='56' y='1149.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>筆順與整筆檢查通過，而且總分 ≥ 60</text><polyline points='340,220 340,255 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,355 340,390 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,490 340,525 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,625 340,660 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,760 340,795 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,895 340,930 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='340,1030 340,1065 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><rect x='40' y='1235' width='270' height='90' rx='6' fill='#dff3ed' stroke='#517b9a' stroke-width='2'/><text x='56' y='1264.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>通過</text><text x='56' y='1289.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>ScorePending(): Coins++</text><text x='56' y='1314.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>增加一枚金幣</text><rect x='370' y='1235' width='270' height='90' rx='6' fill='#fff0e8' stroke='#517b9a' stroke-width='2'/><text x='386' y='1264.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>未通過</text><text x='386' y='1289.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>ScorePending(): !Passed</text><text x='386' y='1314.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>不增加金幣</text><polyline points='240,1165 240,1200 175,1200 175,1235 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='440,1165 440,1200 505,1200 505,1235 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><rect x='40' y='1370' width='600' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='1399.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>PracticeForm 更新結果</text><text x='56' y='1424.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>RefreshSession() → Invalidate() → OnPaint()</text><text x='56' y='1449.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>顯示分數、錯誤筆畫、回饋與練習格</text><polyline points='175,1325 175,1370 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='505,1325 505,1370 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><rect x='880' y='125' width='660' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='154.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>複製原始筆跡</text><text x='896' y='179.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>TrajectoryChecker.Copy()</text><text x='896' y='204.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>不裁尾、不自動接回提筆、不拆次筆畫</text><rect x='880' y='260' width='660' height='95' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='289.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>接觸段整理</text><text x='896' y='314.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>TrajectoryChecker.ContactStroke()</text><text x='896' y='339.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>一次落筆至提筆為一筆，保留完整端點</text><rect x='880' y='395' width='660' height='110' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='424.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>ShapeScorer</text><text x='896' y='449.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>Evaluate() → Normalize(), BestAlignment(), Pair() / Overall()</text><text x='896' y='474.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>整字等比例縮放與平移；完整筆畫一對一比對</text><text x='896' y='495.881248092651' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>線條、長度、路徑、端點、彎曲、展開</text><rect x='880' y='545' width='660' height='110' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='574.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>StructureScorer</text><text x='896' y='599.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>StructureScorer.Check() → SizeRatio(), Difference()</text><text x='896' y='624.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>有部件資料時，比較大小比例、距離與對齊</text><text x='896' y='645.881248092651' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>只量測原本關係，不分開放大部件</text><rect x='880' y='695' width='660' height='110' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='724.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>TrajectoryChecker</text><text x='896' y='749.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>TrajectoryChecker.Check() → Assign(), Distance(), EndDistance()</text><text x='896' y='774.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>檢查筆數、筆順、方向、整筆路徑與中途提筆</text><text x='896' y='795.881248092651' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>筆數不符的 59 分上限在 ShapeScorer.Evaluate() 套用</text><rect x='880' y='845' width='660' height='130' rx='6' fill='#dff3ed' stroke='#517b9a' stroke-width='2'/><text x='896' y='874.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>總分與通過判定</text><text x='896' y='899.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>ShapeScorer.Overall() / StructureResult.AdjustScore()</text><text x='896' y='924.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>字形分 = min（筆長加權平均，最差筆 + 25）</text><text x='896' y='945.881248092651' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>總分 = 字形分 × 結構倍率</text><text x='896' y='967.162496185303' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>速度與力量僅回饋，不加扣分</text><rect x='880' y='1015' width='660' height='110' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='1044.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>WritingEvaluation</text><text x='896' y='1069.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>WritingScorer.Evaluate() → WritingEvaluation.Passed</text><text x='896' y='1094.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>傳回精確分數、是否通過、筆畫配對與錯誤說明</text><text x='896' y='1115.88124809265' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>通過狀態與字形分數分開呈現</text><polyline points='1210,220 1210,255 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='1210,355 1210,390 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='1210,505 1210,540 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='1210,655 1210,690 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='1210,805 1210,840 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><polyline points='1210,975 1210,1010 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><rect x='880' y='1210' width='660' height='100' rx='6' fill='#e8f3fa' stroke='#517b9a' stroke-width='2'/><text x='896' y='1239.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>回到練習</text><text x='896' y='1264.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>PracticeForm.Animate() / PracticeSession.ClearSelected(), Select()</text><text x='896' y='1289.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>可重播、動態比對、重寫此格或選另一字格</text><polyline points='1210,1125 1210,1210 ' fill='none' stroke='#517b9a' stroke-width='3' marker-end='url(#arrow)'/><text x='880' y='1380.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>啟動時不等待裝置連線；沒有連線也能查看範例。</text><rect x='40' y='1510' width='1500' height='90' rx='6' fill='#edf0fa' stroke='#517b9a' stroke-width='2'/><text x='56' y='1539.4' font-size='23.994' fill='#143750' font-family='Microsoft JhengHei, sans-serif'>歷史回顧</text><text x='56' y='1564.3' font-size='14.663' fill='#176b78' font-family='Microsoft JhengHei, sans-serif'>PracticeForm.OpenRecord() → PracticeSession.Review() → WritingScorer.Evaluate()</text><text x='56' y='1589.6' font-size='15.996' fill='#23475d' font-family='Microsoft JhengHei, sans-serif'>讀取既有筆跡 → 同一套 WritingScorer → 顯示結果（不增加金幣）</text></svg>